name: Test

on:
    # Trigger the workflow on push or pull request,
    # but only for the master branch
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                # Node 22 is supported at runtime (>=22.12, require(esm)), but Jest can only
                # load the ESM-only NestJS 12 / @nestjs/passport 12 packages on Node >= 24.9,
                # so the Jest suite runs on 24+ and Node 22 runs the smoke test only.
                node-version: [22.x, 24.x, 26.x]

        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: yarn
            - name: Install
              run: yarn install --frozen-lockfile
            - name: Lint
              run: yarn run lint
            - name: Build
              run: yarn run build
            - name: Smoke test (built package)
              run: yarn run test:smoke
            - name: Test
              if: ${{ matrix.node-version != '22.x' }}
              run: yarn run test:cov
            - name: Codecov
              if: ${{ matrix.node-version == '24.x' }}
              uses: codecov/codecov-action@v7
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./coverage/coverage-final.json
                  fail_ci_if_error: true

    # The build job tests the latest versions (NestJS 12, passport 0.7),
    # this one tests the other supported majors of the peer dependencies
    # (and the transport packages that go with each NestJS major).
    compatibility:
        name: NestJS ${{ matrix.nest }} / passport ${{ matrix.passport }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                include:
                    # express 4, Apollo Server 4
                    - nest: 10
                      passport: '0.6'
                      graphql: 12
                      extra: '@apollo/server@^4 graphql-ws@^5'
                    - nest: 11
                      passport: '0.7'
                      graphql: 13
                      extra: ''
                    - nest: 12
                      passport: '0.6'
                      graphql: 14
                      extra: ''

        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js 24.x
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: yarn
            - name: Install
              run: |
                  yarn install --frozen-lockfile
                  yarn add --dev --ignore-scripts \
                      @nestjs/common@^${{ matrix.nest }} @nestjs/core@^${{ matrix.nest }} \
                      @nestjs/testing@^${{ matrix.nest }} @nestjs/platform-express@^${{ matrix.nest }} \
                      @nestjs/platform-fastify@^${{ matrix.nest }} @nestjs/websockets@^${{ matrix.nest }} \
                      @nestjs/platform-socket.io@^${{ matrix.nest }} @nestjs/microservices@^${{ matrix.nest }} \
                      @nestjs/passport@^${{ matrix.nest }} \
                      @nestjs/graphql@^${{ matrix.graphql }} @nestjs/apollo@^${{ matrix.graphql }} \
                      passport@~${{ matrix.passport }}.0 ${{ matrix.extra }}
            - name: Build
              run: yarn run build
            - name: Smoke test (built package)
              run: yarn run test:smoke
            - name: Test
              run: yarn run test
